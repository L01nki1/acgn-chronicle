name: CI

# Team convention (docs/ONBOARDING.md §4):
#   - CI may go online only to install dependencies; **tests make zero external requests**
#     (tests/conftest.py intercepts sockets).
#   - No live crawling, no model download, no LLM API calls: all mocked via fixtures / respx.
#   - ubuntu catches case-sensitivity bugs (macOS is case-insensitive, so only CI sees them);
#     macos catches differences on the team's actual platform.

on:
  # Every branch, not a pattern: members work on their own branch and push before opening a PR,
  # so a `branches: [main, "wp*/**"]` filter silently gives them no remote check until the PR
  # exists (a branch named `wp1-ingest` or `fix/typo` matches neither). Tags are excluded by
  # using a branch filter rather than a bare `push:`.
  push:
    branches: ["**"]
  # The PR event is the merge gate: it runs again even if the branch push already passed, because
  # this is the run a reviewer looks at and the one a ruleset can require.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev extras only - no embed/llm heavy deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Contract schema in sync (invariant 5)
        run: python scripts/export_schema.py --check

      - name: Tests (no network)
        run: pytest -q
