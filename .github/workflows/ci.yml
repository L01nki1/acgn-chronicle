name: CI

# 组内约定（docs/ONBOARDING.md §4）：
#   - CI 只允许「装依赖」联网；**测试运行期间零外部请求**（tests/conftest.py 会拦截 socket）。
#   - 不打真站、不下载模型、不调用 LLM API：这些一律走 fixture / respx 模拟。
#   - ubuntu 抓大小写敏感（macOS 默认不敏感，组员的 case bug 只有这里能抓到）；
#     macos 抓组员本机平台差异。

on:
  push:
    branches: [main, "wp*/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev only — 不含 embed/llm 重依赖)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Contract schema in sync (02 不变量 5)
        run: python scripts/export_schema.py --check

      - name: Tests (no network)
        run: pytest -q
