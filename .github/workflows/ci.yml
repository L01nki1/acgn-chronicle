name: CI

# Team convention (docs/ONBOARDING.md §4):
#   - CI may go online only to install dependencies; **tests make zero external requests**
#     (tests/conftest.py intercepts sockets).
#   - No live crawling, no model download, no LLM API calls: all mocked via fixtures / respx.
#   - ubuntu catches case-sensitivity bugs (macOS is case-insensitive, so only CI sees them);
#     macos catches differences on the team's actual platform.

on:
  # Every branch, not a pattern: members work on their own branch and push before opening a PR,
  # so a `branches: [main, "wp*/**"]` filter silently gives them no remote check until the PR
  # exists (a branch named `wp1-ingest` or `fix/typo` matches neither). Tags are excluded by
  # using a branch filter rather than a bare `push:`.
  push:
    branches: ["**"]
  # The PR event is the merge gate: it runs again even if the branch push already passed, because
  # this is the run a reviewer looks at and the one a ruleset can require.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three platforms the team actually uses: four members on macOS, the owner on Windows,
        # Linux for the case-sensitivity check. A platform nobody tests is a platform that breaks
        # on that one person's machine and nowhere else.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          # 3.13 is what a fresh laptop has installed; people should not discover a version
          # problem only after writing an adapter. The baseline above stays 3.11 (CI contract).
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev extras only - no embed/llm heavy deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Contract schema in sync (invariant 5)
        run: python scripts/export_schema.py --check

      - name: Tests (no network)
        run: pytest -q

  # The test job installs `[dev]` only, so torch / sentence-transformers / chromadb are never
  # resolved in CI. A missing wheel for one platform (macOS arm64 is the usual culprit) would
  # then surface on one member's laptop and nowhere else. `--dry-run` resolves the full tree
  # without downloading gigabytes, which is the cheap way to keep that promise.
  # Not a required check by default: it is a warning about the environment, not about the code.
  deps:
    name: deps resolve / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve dev + embed + store + llm for this platform
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -e ".[dev,embed,store,llm]"
