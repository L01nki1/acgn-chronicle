[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "acgn-rag"
version = "0.1.0"
description = "ACGN cross-time archive QA over RAG with verifiable citations (CS5481 Topic 5)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Course project, not for redistribution" }
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27",
  "feedparser>=6.0",
  "selectolax>=0.3.21",      # HTML list-page parsing; an order of magnitude faster than bs4
  "charset-normalizer>=3.3",
  "tenacity>=8.3",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "pyyaml>=6.0",
]

# Heavy dependencies are separated: CI installs [dev] only, so tests stay network- and model-free
[project.optional-dependencies]
embed = [
  "sentence-transformers>=3.0,<7",   # upper band: an unaudited major could change encode semantics mid-project
  "torch>=2.3",
  "numpy>=1.26",
]
store = [
  "chromadb>=1.0,<2",        # pinned band: required by the 3.13 baseline (chromadb <1.x pins
                             # chroma-hnswlib, which has no cp313 wheels - local build verified
                             # failing); 1.x = Rust core + configuration= HNSW API + int[] metadata
]
llm = [
  "openai>=1.30",            # OpenAI-compatible client only; the vendor comes from .env
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",             # intercepts httpx so tests never reach the network
  "ruff>=0.17,<0.18",        # pinned band: a new ruff can change formatting rules and redden CI for everyone
  "numpy>=1.26",             # let CI run the fake-encoder tests without the heavy [embed] extra
]
all = [
  "acgn-rag[embed,store,llm]",
]

[project.scripts]
acgn = "acgn_rag.cli:app"

[tool.ruff]
target-version = "py313"
line-length = 100
# Markdown is excluded on purpose: ruff formats fenced ```python blocks but does not lint them,
# so any illustrative snippet in docs/ could turn the build red for a reason members cannot see
# (and column-aligned comments in docs are intentional). Code formatting stays strict.
extend-exclude = ["data", "notebooks", "tests/ingest/fixtures", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Only line length is relaxed; everything else stays strict
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
  "network: needs the real internet (excluded by default; run locally with -m network)",
  "slow: expensive cases (encoding, index builds)",
]
# network-marked tests are skipped by default: neither CI nor a normal local run touches the net
filterwarnings = ["error::DeprecationWarning:acgn_rag.*"]

# Linux resolves torch from the PyTorch CPU index: the PyPI linux wheel bundles CUDA and is
# ~3 GB larger, and nobody runs torch-CUDA locally (GPU lane = Colab; local fallback = OpenVINO).
# macOS/Windows PyPI wheels are already CPU/MPS builds, so the marker leaves them untouched.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
